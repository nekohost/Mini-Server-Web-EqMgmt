<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - 장비 관리 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 dark:bg-slate-900 dark:text-slate-200 transition-colors duration-300 min-h-screen">
    <div class="max-w-2xl mx-auto relative">
        
        <!-- 상단 네비게이션 -->
        <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm mb-6 flex justify-between items-center border border-slate-200 dark:border-slate-700 transition-colors">
            <div class="flex items-center gap-3">
                <a href="/portal" class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 text-sm font-semibold transition">&larr; 포털로</a>
                <span class="text-slate-300 dark:text-slate-600">|</span>
                <span class="text-sm font-bold text-slate-800 dark:text-slate-100">내 정보 (마이페이지)</span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="라이트/다크 모드 전환">
                    🌗
                </button>
                <span id="session-timer-badge"></span>
            </div>
        </div>

        <main class="bg-white dark:bg-slate-800 rounded-xl shadow-md overflow-hidden p-6 md:p-8 border border-slate-200 dark:border-slate-700">
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-3 mb-6">사용자 프로필</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <div>
                    <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">아이디</label>
                    <div class="text-base font-semibold text-slate-800 dark:text-slate-200">{{ user.LoginId }}</div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">이름 / 닉네임</label>
                    <div class="text-base font-semibold text-slate-800 dark:text-slate-200">{{ user.Name }} / {{ user.NickName }}</div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-500 dark:text-slate-400 mb-1">역할 (권한)</label>
                    <div class="text-base font-semibold text-blue-600 dark:text-blue-400">{{ user.Role }}</div>
                </div>
            </div>

            <!-- UI/UX 맞춤 설정 섹션 -->
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-3 mb-6">환경 설정 (UI/UX)</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 bg-slate-50 dark:bg-slate-700/30 p-5 rounded-xl border border-slate-200 dark:border-slate-700">
                
                <!-- 테마 설정 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-palette text-brand-500"></i> 테마 설정
                    </label>
                    <div class="flex flex-col space-y-2">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="theme_setting" value="light" onchange="applyThemeSetting(this.value)" class="form-radio text-brand-500 focus:ring-brand-500 h-4 w-4">
                            <span class="text-sm font-medium text-slate-600 dark:text-slate-300">🌞 라이트 모드</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="theme_setting" value="dark" onchange="applyThemeSetting(this.value)" class="form-radio text-brand-500 focus:ring-brand-500 h-4 w-4">
                            <span class="text-sm font-medium text-slate-600 dark:text-slate-300">🌙 다크 모드</span>
                        </label>
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="radio" name="theme_setting" value="system" onchange="applyThemeSetting(this.value)" class="form-radio text-brand-500 focus:ring-brand-500 h-4 w-4">
                            <span class="text-sm font-medium text-slate-600 dark:text-slate-300">💻 시스템 설정 따름</span>
                        </label>
                    </div>
                </div>

                <!-- 레이아웃 스킨 설정 -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-desktop text-brand-500"></i> 화면 레이아웃 스킨 (감사 로그 등)
                    </label>
                    <div class="flex flex-col space-y-3">
                        <label class="flex items-start space-x-3 cursor-pointer group">
                            <div class="mt-0.5">
                                <input type="radio" name="layout_skin" value="standard" onchange="saveSkinSetting(this.value)" class="form-radio text-brand-500 focus:ring-brand-500 h-4 w-4">
                            </div>
                            <div>
                                <span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-brand-500 transition-colors">표준 데스크탑 스킨 (Standard)</span>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">여백이 있고 둥근 모서리를 가진 시스템 표준 디자인.</p>
                            </div>
                        </label>
                        <label class="flex items-start space-x-3 cursor-pointer group">
                            <div class="mt-0.5">
                                <input type="radio" name="layout_skin" value="edge" onchange="saveSkinSetting(this.value)" class="form-radio text-brand-500 focus:ring-brand-500 h-4 w-4">
                            </div>
                            <div>
                                <span class="text-sm font-medium text-slate-700 dark:text-slate-200 group-hover:text-brand-500 transition-colors">모바일 친화 스킨 (Edge)</span>
                                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">화면을 꽉 채우고 표출 데이터 양을 극대화한 디자인.</p>
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 border-b border-slate-200 dark:border-slate-700 pb-3 mb-6">비밀번호 변경</h2>
            
            <form id="passwordForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">현재 비밀번호</label>
                    <input type="password" id="current_pw" required 
                           class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white dark:bg-slate-700 text-slate-900 dark:text-white transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">새 비밀번호</label>
                    <input type="password" id="new_pw" required 
                           class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white dark:bg-slate-700 text-slate-900 dark:text-white transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">새 비밀번호 확인</label>
                    <input type="password" id="new_pw_confirm" required 
                           class="w-full px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white dark:bg-slate-700 text-slate-900 dark:text-white transition">
                </div>
                <div id="pwMessage" class="hidden text-sm font-medium p-3 rounded-lg"></div>
                
                <div class="flex justify-end pt-2">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-6 rounded-lg shadow transition duration-200">
                        비밀번호 변경
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script src="/static/js/session_timer.js"></script>
    <script>
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const current = document.getElementById('current_pw').value;
            const new_pw = document.getElementById('new_pw').value;
            const confirm = document.getElementById('new_pw_confirm').value;
            const msg = document.getElementById('pwMessage');
            
            if (new_pw !== confirm) {
                msg.textContent = '새 비밀번호가 일치하지 않습니다.';
                msg.className = 'text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600 border border-red-200 block';
                return;
            }
            
            try {
                const res = await fetch('/api/users/change_password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ current_password: current, new_password: new_pw })
                });
                const json = await res.json();
                
                if (json.success) {
                    msg.textContent = '비밀번호가 성공적으로 변경되었습니다! 다시 로그인 해주세요.';
                    msg.className = 'text-sm font-medium p-3 rounded-lg bg-green-50 text-green-600 border border-green-200 block';
                    document.getElementById('passwordForm').reset();
                    setTimeout(() => { location.href = '/logout'; }, 2000);
                } else {
                    msg.textContent = json.message || '변경 실패';
                    msg.className = 'text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600 border border-red-200 block';
                }
            } catch (err) {
                console.error(err);
                msg.textContent = '네트워크 오류가 발생했습니다.';
                msg.className = 'text-sm font-medium p-3 rounded-lg bg-red-50 text-red-600 border border-red-200 block';
            }
        });

        // -----------------------------------------------------
        // 환경 설정 (UI/UX) 로직
        // -----------------------------------------------------
        document.addEventListener('DOMContentLoaded', async () => {
            // 1. 서버에서 user_settings 불러오기
            try {
                const res = await fetch('/api/user_settings');
                const data = await res.json();
                
                if (data.success && data.settings) {
                    // 스킨 설정 라디오 버튼 초기화
                    const layoutSkin = data.settings.layout_skin || 'standard';
                    const skinRadio = document.querySelector(`input[name="layout_skin"][value="${layoutSkin}"]`);
                    if (skinRadio) skinRadio.checked = true;
                    
                    // 테마(로컬스토리지 기반) 라디오 버튼 초기화
                    let currentTheme = localStorage.getItem('theme') || 'system';
                    const themeRadio = document.querySelector(`input[name="theme_setting"][value="${currentTheme}"]`);
                    if (themeRadio) themeRadio.checked = true;
                }
            } catch (err) {
                console.warn('사용자 설정을 불러오지 못했습니다.', err);
            }
        });

        async function saveSkinSetting(val) {
            try {
                // 백엔드 DB 영속화
                await fetch('/api/user_settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ layout_skin: val })
                });
                // alert('스킨 설정이 저장되었습니다. 해당 화면 진입 시 반영됩니다.');
            } catch (err) {
                console.warn('스킨 설정 저장 실패:', err);
            }
        }

        function applyThemeSetting(val) {
            if (val === 'light') {
                localStorage.theme = 'light';
                document.documentElement.classList.remove('dark');
            } else if (val === 'dark') {
                localStorage.theme = 'dark';
                document.documentElement.classList.add('dark');
            } else {
                localStorage.removeItem('theme');
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }
        }
    </script>
</body>
</html>

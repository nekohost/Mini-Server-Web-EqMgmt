{% extends 'root_frame.html' %}

{% block title %}비밀번호 재설정 (Staging) - 미니서버 통합 관리 시스템{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200 dark:border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">새 비밀번호 설정</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">안전한 새 비밀번호를 입력해 주세요</p>
        </div>

        <form id="resetPasswordForm" class="space-y-5">
            <input type="hidden" id="resetToken" value="">

            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">새 비밀번호</label>
                <input type="password" id="NewPassword" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="새 비밀번호를 입력하세요">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">새 비밀번호 확인</label>
                <input type="password" id="NewPasswordConfirm" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="새 비밀번호를 다시 입력하세요">
                <p id="pwMatchHint" class="hidden text-xs mt-1"></p>
            </div>

            <div id="errorMessage" class="hidden p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200 text-center"></div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
                비밀번호 변경 완료
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts_base %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (!token) {
            alert('유효하지 않은 접근입니다. 토큰이 존재하지 않습니다.');
            location.href = '/login';
            return;
        }
        document.getElementById('resetToken').value = token;
    });

    const newPw = document.getElementById('NewPassword');
    const confirmPw = document.getElementById('NewPasswordConfirm');
    const hint = document.getElementById('pwMatchHint');

    function checkMatch() {
        if (!confirmPw.value) {
            hint.classList.add('hidden');
            return;
        }
        hint.classList.remove('hidden');
        if (newPw.value === confirmPw.value) {
            hint.innerText = '비밀번호가 일치합니다.';
            hint.className = 'text-xs mt-1 text-green-600 font-semibold';
        } else {
            hint.innerText = '비밀번호가 일치하지 않습니다.';
            hint.className = 'text-xs mt-1 text-red-600 font-semibold';
        }
    }

    newPw.addEventListener('input', checkMatch);
    confirmPw.addEventListener('input', checkMatch);

    document.getElementById('resetPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const token = document.getElementById('resetToken').value;
        const new_password = newPw.value;
        const confirm_password = confirmPw.value;
        const errorDiv = document.getElementById('errorMessage');

        errorDiv.classList.add('hidden');

        if (new_password !== confirm_password) {
            errorDiv.innerText = '비밀번호가 일치하지 않습니다.';
            errorDiv.classList.remove('hidden');
            return;
        }

        try {
            const res = await fetch('/api/auth/reset_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, new_password })
            });

            const data = await res.json();
            if (res.ok && data.success) {
                alert(data.message);
                location.href = '/login';
            } else {
                errorDiv.innerText = data.message || '비밀번호 변경에 실패했습니다.';
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorDiv.innerText = '서버 통신 오류가 발생했습니다.';
            errorDiv.classList.remove('hidden');
        }
    });
</script>
{% endblock %}

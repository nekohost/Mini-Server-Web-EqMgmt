<main><h1>실제 운영 화면 검증 · 2026-11-04</h1>
<p>https://nekohost.org의 실제 로그인·Strata API 응답을 사용한 원본 JPEG 16개다. Staging 모의 화면과 구분한다. 이미지를 누르면 원본 크기로 열린다.</p>
<p class="note">제조사 신청 카드의 잘못된 항목명을 발견해 수정했다. 업무 확정은 실행하지 않았고 검증용 카드는 취소 사유·이력을 남겨 닫았다. 테마는 시스템, 대화의 다음 추론은 medium으로 복구했다.</p>

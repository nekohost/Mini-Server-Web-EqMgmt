platform: gemini-antigravity
status: active-profile-runtime-verification-required
file_read:
  preferred: ide-read-api
file_edit:
  preferred: ide-structured-edit-api
  required_properties: [diff-visible, undo-compatible, scoped]
terminal:
  allowed: [read, inspect, approved-execute, validate]
  general_writes_default: forbidden
  general_write_fallback:
    mode: proposal-only-before-explicit-approval
    allowed_when: [structured-edit-unavailable, diff-visible, undo-or-equivalent-recovery-verified]
    otherwise: forbidden
git_read_only:
  preferred: "node .agent-governance/tooling/git-readonly.mjs -- <subcommand> <args>"
  required_environment: { GIT_OPTIONAL_LOCKS: "0" }
  direct_status_or_diff_without_optional_lock: forbidden
  scope: [status, diff, log, show, rev-parse, ls-files, fsck, check-attr, check-ignore, for-each-ref]
windows_search:
  known_broken: grep_search-with-drive-letter-absolute-output
  preferred: run-command-rg-from-workspace-root-with-relative-paths
  verification: inspect-command-exit-code-and-complete-output
persistent_command_grants:
  multiline: forbidden
  preferred: scoped-single-line-command-or-temporary-script
  reason: antigravity-grant-parser-rejects-persisted-multiline-command-patterns
conversation_storage:
  preferred: ide-structured-edit-api-when-reliable
  known_risk: user-reported-persistent-omission-and-hallucinated-miswrite
  terminal_fallback: user-approval-after-risk-or-failure-confirmation
conversation_export:
  source: "%USERPROFILE%/.gemini/antigravity*/brain/<conversation-id>/.system_generated"
  adapter: tooling/conversation-recorder/antigravity.mjs
  identity: workspace-match-plus-parent-mailbox-sender-recipient
  exact_timestamps_guaranteed: true
  exact_full_transcript_guaranteed: true
  supported_visible_events: [user, final_answer, subagent_task, subagent_status, subagent_final]
  excluded_events: [system, developer, reasoning, tool_call, tool_result]
  on_missing_capability: report-do-not-fabricate
conversation_automation:
  status: active
  preflight: "node .agent-governance/tooling/conversation-recorder.mjs ensure --platform all --workspace . --json"
  watcher: fs-watch-plus-1500ms-stat-poll
scope:
  default_owner: workspace-project
  external_reference: owner-unchanged
  external_execution: owner-unchanged-when-subordinate-to-project-task
  foreign_governed_write: nested-handoff-required
  full_switch: explicit-user-intent-required
instruction_entrypoint: GEMINI.md

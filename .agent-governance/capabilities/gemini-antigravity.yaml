platform: gemini-antigravity
status: active-profile-runtime-verification-required
file_read:
  preferred: ide-read-api
file_edit:
  preferred: ide-structured-edit-api
  required_properties: [diff-visible, undo-compatible, scoped]
terminal:
  allowed: [read, inspect, approved-execute, validate]
  general_writes_default: forbidden
  general_write_fallback:
    mode: proposal-only-before-explicit-approval
    allowed_when: [structured-edit-unavailable, diff-visible, undo-or-equivalent-recovery-verified]
    otherwise: forbidden
conversation_storage:
  preferred: ide-structured-edit-api-when-reliable
  known_risk: user-reported-persistent-omission-and-hallucinated-miswrite
  terminal_fallback: user-approval-after-risk-or-failure-confirmation
conversation_export:
  exact_timestamps_guaranteed: runtime-dependent
  exact_full_transcript_guaranteed: runtime-dependent
  on_missing_capability: report-do-not-fabricate
instruction_entrypoint: GEMINI.md


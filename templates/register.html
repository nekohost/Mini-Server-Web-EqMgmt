<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - 미니서버 통합 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">계정 생성</h1>
            <p class="text-sm text-slate-500 mt-1">시스템 사용을 위해 정보를 입력해 주세요</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">로그인 아이디</label>
                <input type="text" id="LoginId" required 
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="영문, 숫자 (예: admin)">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">실명 (이름)</label>
                <input type="text" id="Name" required 
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="본명을 입력하세요">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">닉네임</label>
                <input type="text" id="NickName" required 
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="화면에 표시될 닉네임">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호</label>
                <input type="password" id="Password" required 
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="비밀번호를 입력하세요">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">비밀번호 확인</label>
                <input type="password" id="PasswordConfirm" required 
                       class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="비밀번호를 다시 한 번 입력하세요">
            </div>

            <div id="errorMessage" class="hidden p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200 text-center"></div>

            <button type="submit" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
                가입하기
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-500">이미 계정이 있으신가요? <a href="/login" class="text-blue-600 font-semibold hover:underline">로그인</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const LoginId = document.getElementById('LoginId').value;
            const Name = document.getElementById('Name').value;
            const NickName = document.getElementById('NickName').value;
            const Password = document.getElementById('Password').value;
            const PasswordConfirm = document.getElementById('PasswordConfirm').value;
            const errorDiv = document.getElementById('errorMessage');

            errorDiv.classList.add('hidden');

            if (Password !== PasswordConfirm) {
                errorDiv.innerText = '비밀번호가 서로 일치하지 않습니다.';
                errorDiv.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ LoginId, Name, NickName, Password })
                });

                const data = await res.json();

                if (res.ok && data.success) {
                    alert(data.message);
                    location.href = '/login';
                } else {
                    errorDiv.innerText = data.message || '가입에 실패했습니다.';
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = '서버 통신 오류가 발생했습니다.';
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>

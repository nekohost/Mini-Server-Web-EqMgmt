{% extends 'root_frame.html' %}

{% block title %}회원가입 - 미니서버 통합 관리 시스템{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200 dark:border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">계정 생성</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">시스템 사용을 위해 정보를 입력해 주세요</p>
        </div>

        <form id="registerForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">로그인 아이디</label>
                <input type="text" id="LoginId" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="영문, 숫자 (예: admin)">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">실명 (이름)</label>
                <input type="text" id="Name" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="본명을 입력하세요">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">닉네임</label>
                <input type="text" id="NickName" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="화면에 표시될 닉네임">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">비밀번호</label>
                <input type="password" id="Password" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="비밀번호를 입력하세요">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">비밀번호 확인</label>
                <input type="password" id="PasswordConfirm" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="비밀번호를 다시 한 번 입력하세요">
                <p id="passwordMatchHint" class="hidden text-xs mt-1"></p>
            </div>

            <div id="errorMessage" class="hidden p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200 text-center"></div>

            <button type="submit" 
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
                가입하기
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700 text-center">
            <p class="text-sm text-slate-500 dark:text-slate-400">이미 계정이 있으신가요? <a href="/login" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">로그인</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_scripts_base %}
<script>
    const passwordInput = document.getElementById('Password');
    const confirmInput = document.getElementById('PasswordConfirm');
    const matchHint = document.getElementById('passwordMatchHint');

    function checkPasswordMatch() {
        if (confirmInput.value === '') {
            matchHint.classList.add('hidden');
            return;
        }
        matchHint.classList.remove('hidden');
        if (passwordInput.value === confirmInput.value) {
            matchHint.innerText = '비밀번호가 일치합니다.';
            matchHint.className = 'text-xs mt-1 text-green-600 font-semibold';
        } else {
            matchHint.innerText = '비밀번호가 일치하지 않습니다.';
            matchHint.className = 'text-xs mt-1 text-red-600 font-semibold';
        }
    }

    passwordInput.addEventListener('input', checkPasswordMatch);
    confirmInput.addEventListener('input', checkPasswordMatch);

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const LoginId = document.getElementById('LoginId').value;
        const Name = document.getElementById('Name').value;
        const NickName = document.getElementById('NickName').value;
        const Password = document.getElementById('Password').value;
        const PasswordConfirm = document.getElementById('PasswordConfirm').value;
        const errorDiv = document.getElementById('errorMessage');

        errorDiv.classList.add('hidden');

        if (Password !== PasswordConfirm) {
            errorDiv.innerText = '비밀번호가 서로 일치하지 않습니다.';
            errorDiv.classList.remove('hidden');
            return;
        }

        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ LoginId, Name, NickName, Password })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                alert(data.message);
                location.href = '/login';
            } else {
                errorDiv.innerText = data.message || '가입에 실패했습니다.';
                if (data.is_recovery_target) {
                    errorDiv.className = 'p-4 bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 text-sm rounded-xl border border-amber-200 dark:border-amber-800 text-left leading-relaxed font-medium';
                } else {
                    errorDiv.className = 'p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200 text-center';
                }
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorDiv.innerText = '서버 통신 오류가 발생했습니다.';
            errorDiv.classList.remove('hidden');
        }
    });
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장비 관리 시스템</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8">
    <div class="max-w-6xl mx-auto relative">
        
        <!-- 상단 사용자 정보 및 글로벌 내비게이션 바 -->
        <div class="bg-white rounded-xl p-4 shadow-sm mb-6 flex justify-between items-center border border-slate-200">
            <div class="flex items-center gap-3">
                <a href="/portal" class="text-slate-500 hover:text-slate-800 text-sm font-semibold transition">&larr; 포털로</a>
                <span class="text-slate-300">|</span>
                <span class="text-sm font-bold text-slate-800">장비 관리 시스템</span>
            </div>
            <div class="flex items-center gap-4">
                <span id="userInfoDisplay" class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1 rounded-full border border-slate-200">
                    👤 {{ user.NickName }} (<strong class="text-blue-600">{{ user.Role }}</strong>)
                </span>
                <a href="/logout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition">로그아웃</a>
            </div>
        </div>

        <header class="mb-6 flex justify-between items-center">
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900">내 보유 장비 목록</h1>
            <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg shadow-lg transition duration-200">
                + 신규 장비 등록
            </button>
        </header>

        <!-- ==================================================== -->
        <!-- [UI 모듈 1] 장비 목록 테이블 -->
        <!-- ==================================================== -->
        <main class="bg-white rounded-xl shadow-md overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr id="tableHeaderRow">
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">장비명</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">카테고리</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">제조사/모델</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">시리얼 넘버</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">구입일</th>
                            <th id="ownerHeader" class="hidden px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">소유자</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">수정일</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 uppercase tracking-wider">관리</th>
                        </tr>
                    </thead>
                    <tbody id="equipmentTableBody" class="bg-white divide-y divide-slate-200">
                        <!-- JS 렌더링 -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ==================================================== -->
    <!-- [UI 모듈 2] 등록/수정 모달 (팝업) -->
    <!-- ==================================================== -->
    <div id="equipmentModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-40 p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden">
            <div class="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
                <h2 id="modalTitle" class="text-xl font-bold text-slate-800">신규 장비 등록</h2>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            <form id="equipmentForm" class="p-6">
                <input type="hidden" id="EquipmentId">
                <input type="hidden" id="UserId"> <!-- 선택된 소유자 UserId -->
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- 관리자용 소유자 지정 영역 -->
                    <div id="ownerSelectContainer" class="hidden md:col-span-2 bg-blue-50 p-4 rounded-lg border border-blue-100 mb-2 flex items-center justify-between">
                        <div>
                            <p class="text-sm font-semibold text-blue-900">장비 소유자 지정</p>
                            <p id="selectedOwnerDisplay" class="text-xs text-blue-700 mt-0.5">기본값: (본인)</p>
                        </div>
                        <button type="button" onclick="openUserSearchModal()" class="bg-white border border-blue-200 text-blue-600 hover:bg-blue-100 font-medium py-1.5 px-4 rounded shadow-sm text-sm transition">
                            소유자 검색 및 변경
                        </button>
                    </div>

                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-1">장비 별명 (필수)</label>
                        <input type="text" id="Name" required class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">카테고리</label>
                        <input type="text" id="Category" placeholder="예: 노트북" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">제조사</label>
                        <input type="text" id="Manufacturer" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">모델명</label>
                        <input type="text" id="ModelName" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">시리얼 넘버</label>
                        <input type="text" id="SerialNumber" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">구입일</label>
                        <input type="date" id="PurchaseDate" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-slate-700 mb-1">메모/비고</label>
                        <textarea id="Memo" rows="2" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>
                </div>
                <div class="mt-6 flex justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50 font-medium">취소</button>
                    <button type="submit" class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold shadow-md">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ==================================================== -->
    <!-- [UI 모듈 3] 사용자 검색 모달 (관리자 전용) -->
    <!-- ==================================================== -->
    <div id="userSearchModal" class="fixed inset-0 bg-black bg-opacity-60 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md overflow-hidden">
            <div class="px-5 py-4 border-b flex justify-between items-center">
                <h3 class="font-bold text-lg text-slate-800">사용자 검색</h3>
                <button onclick="closeUserSearchModal()" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            <div class="p-5">
                <div class="flex gap-2 mb-4">
                    <input type="text" id="userSearchKeyword" placeholder="이름, 닉네임, 로그인ID 검색" 
                           class="flex-1 border border-slate-300 rounded p-2 focus:ring-2 focus:ring-blue-500 outline-none"
                           onkeypress="if(event.key==='Enter') searchUser()">
                    <button type="button" onclick="searchUser()" class="bg-slate-800 text-white px-4 rounded hover:bg-slate-700">검색</button>
                </div>
                <ul id="userSearchResult" class="max-h-60 overflow-y-auto divide-y divide-slate-100 border rounded-lg bg-slate-50 hidden">
                    <!-- JS 검색 결과 렌더링 -->
                </ul>
                <div id="userSearchEmpty" class="text-center text-slate-500 text-sm py-8 hidden">
                    검색 결과가 없습니다.
                </div>
            </div>
        </div>
    </div>

    <!-- ==================================================== -->
    <!-- [JS 스크립트 모듈] -->
    <!-- ==================================================== -->
    <script>
        let currentEquipmentData = [];
        let currentUser = null;

        async function fetchUserInfo() {
            try {
                const res = await fetch('/api/me');
                currentUser = await res.json();
                
                if (currentUser.Role === 'admin') {
                    document.getElementById('ownerHeader').classList.remove('hidden');
                    document.getElementById('ownerSelectContainer').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchEquipment() {
            if (!currentUser) await fetchUserInfo();

            const res = await fetch('/api/equipment');
            const data = await res.json();
            currentEquipmentData = data;
            
            const tbody = document.getElementById('equipmentTableBody');
            tbody.innerHTML = '';

            const isAdmin = currentUser && currentUser.Role === 'admin';

            data.forEach(item => {
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap">
                            <div class="text-sm font-bold text-slate-900">${item.Name}</div>
                            ${item.Memo ? `<div class="text-xs text-slate-500 truncate max-w-xs">${item.Memo}</div>` : ''}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-blue-100 text-blue-800">
                                ${item.Category || '기타'}
                            </span>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600">
                            ${item.Manufacturer || '-'} / ${item.ModelName || '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 font-mono">
                            ${item.SerialNumber || '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500">
                            ${item.PurchaseDate || '-'}
                        </td>
                        ${isAdmin ? `
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-indigo-600">
                            👤 ${item.OwnerNickName || '미지정'}
                        </td>` : ''}
                        <td class="px-6 py-4 whitespace-nowrap text-xs text-slate-400">
                            ${item.UpdatedAt || item.CreatedAt || '-'}
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="editEquipment(${item.EquipmentId})" class="text-indigo-600 hover:text-indigo-900 mr-3">수정</button>
                            <button onclick="deleteEquipment(${item.EquipmentId})" class="text-red-600 hover:text-red-900">삭제</button>
                        </td>
                    </tr>
                `;
            });
        }

        /* --- 장비 등록/수정 모달 --- */
        function openModal(id = null) {
            const modal = document.getElementById('equipmentModal');
            const form = document.getElementById('equipmentForm');
            const title = document.getElementById('modalTitle');
            
            form.reset();
            document.getElementById('EquipmentId').value = '';
            document.getElementById('UserId').value = ''; 
            document.getElementById('selectedOwnerDisplay').innerText = `기본값: (${currentUser.NickName})`;
            
            if (id) {
                title.innerText = '장비 정보 수정';
                const item = currentEquipmentData.find(e => e.EquipmentId === id);
                if (item) {
                    document.getElementById('EquipmentId').value = item.EquipmentId;
                    document.getElementById('Name').value = item.Name;
                    document.getElementById('Category').value = item.Category || '';
                    document.getElementById('Manufacturer').value = item.Manufacturer || '';
                    document.getElementById('ModelName').value = item.ModelName || '';
                    document.getElementById('SerialNumber').value = item.SerialNumber || '';
                    document.getElementById('PurchaseDate').value = item.PurchaseDate || '';
                    document.getElementById('Memo').value = item.Memo || '';
                    
                    if(item.UserId) {
                        document.getElementById('UserId').value = item.UserId;
                        document.getElementById('selectedOwnerDisplay').innerText = `현재 소유자: ${item.OwnerNickName}`;
                    }
                }
            } else {
                title.innerText = '신규 장비 등록';
            }
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('equipmentModal').classList.add('hidden');
        }

        document.getElementById('equipmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('EquipmentId').value;
            const payload = {
                Name: document.getElementById('Name').value,
                Category: document.getElementById('Category').value,
                Manufacturer: document.getElementById('Manufacturer').value,
                ModelName: document.getElementById('ModelName').value,
                SerialNumber: document.getElementById('SerialNumber').value,
                PurchaseDate: document.getElementById('PurchaseDate').value,
                Memo: document.getElementById('Memo').value,
                UserId: document.getElementById('UserId').value || null
            };

            const url = id ? `/api/equipment/${id}` : '/api/equipment';
            const method = id ? 'PUT' : 'POST';

            try {
                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) {
                    closeModal();
                    fetchEquipment();
                } else {
                    const err = await res.json();
                    alert('오류: ' + err.error);
                }
            } catch (err) {
                alert('통신 오류가 발생했습니다.');
            }
        });

        async function deleteEquipment(id) {
            if (!confirm('정말로 이 장비를 삭제하시겠습니까?')) return;
            try {
                const res = await fetch(`/api/equipment/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    fetchEquipment();
                } else {
                    const err = await res.json();
                    alert('삭제 실패: ' + err.error);
                }
            } catch (err) {
                alert('통신 오류가 발생했습니다.');
            }
        }

        /* --- 사용자 검색 모달 --- */
        function openUserSearchModal() {
            document.getElementById('userSearchModal').classList.remove('hidden');
            document.getElementById('userSearchKeyword').value = '';
            document.getElementById('userSearchResult').classList.add('hidden');
            document.getElementById('userSearchEmpty').classList.add('hidden');
            document.getElementById('userSearchKeyword').focus();
        }

        function closeUserSearchModal() {
            document.getElementById('userSearchModal').classList.add('hidden');
        }

        async function searchUser() {
            const q = document.getElementById('userSearchKeyword').value.trim();
            if (!q) return;

            const ul = document.getElementById('userSearchResult');
            const empty = document.getElementById('userSearchEmpty');
            
            try {
                const res = await fetch(`/api/users/search?q=${encodeURIComponent(q)}`);
                const users = await res.json();
                
                if (users.length === 0) {
                    ul.classList.add('hidden');
                    empty.classList.remove('hidden');
                } else {
                    empty.classList.add('hidden');
                    ul.classList.remove('hidden');
                    ul.innerHTML = users.map(u => `
                        <li class="p-3 hover:bg-blue-50 cursor-pointer flex justify-between items-center transition"
                            onclick="selectUser(${u.UserId}, '${u.NickName}')">
                            <div>
                                <span class="font-bold text-slate-800">${u.NickName}</span>
                                <span class="text-xs text-slate-400 ml-2">(${u.LoginId} / ${u.Name})</span>
                            </div>
                            <span class="text-blue-500 text-xs font-semibold">선택</span>
                        </li>
                    `).join('');
                }
            } catch (err) {
                alert('검색 중 오류가 발생했습니다.');
            }
        }

        function selectUser(userId, nickName) {
            document.getElementById('UserId').value = userId;
            document.getElementById('selectedOwnerDisplay').innerHTML = `지정됨: <strong class="text-blue-800">${nickName}</strong>`;
            closeUserSearchModal();
        }

        // 초기 로드
        fetchEquipment();
    </script>
</body>
</html>

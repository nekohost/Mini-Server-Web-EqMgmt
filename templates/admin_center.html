{% extends 'miniserver_frame.html' %}
{% block title %}관리자 센터 - EqMgmt{% endblock %}
{% block page_title %}관리자 센터{% endblock %}

{% block content %}
<header class="app-page-heading app-content-header">
    <h1 class="app-content-title">관리자 센터</h1>
    <p class="app-content-description">시스템 관리자 전용 메뉴 허브입니다.</p>
</header>

<!-- 서브 메뉴들이 렌더링 될 그리드 -->
<div id="admin-menus-grid" class="edge-card-grid grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <!-- 자바스크립트로 렌더링 -->
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    fetch('/api/menus/children/admin_center')
        .then(res => res.json())
        .then(menus => {
            const grid = document.getElementById('admin-menus-grid');
            grid.innerHTML = '';
            
            if(menus.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">할당된 관리자 메뉴가 없습니다.</div>`;
                return;
            }

            window.MenuCards.render(grid, window.MenuCards.orderAdmin(menus));
        })
        .catch(err => {
            console.error('관리자 메뉴 조회 실패:', err);
            document.getElementById('admin-menus-grid').innerHTML = `<div class="col-span-full text-center py-10 text-red-500">메뉴를 불러오는 중 오류가 발생했습니다.</div>`;
        });
});
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 관리 - 장비 관리 시스템</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 dark:bg-slate-900 dark:text-slate-200 transition-colors duration-300 min-h-screen">
    <div class="max-w-6xl mx-auto relative">
        
        <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm mb-6 flex justify-between items-center border border-slate-200 dark:border-slate-700 transition-colors">
            <div class="flex items-center gap-3">
                <a href="/portal" class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 text-sm font-semibold transition">&larr; 포털로</a>
                <span class="text-slate-300 dark:text-slate-600">|</span>
                <span class="text-sm font-bold text-slate-800 dark:text-slate-100">사용자 관리 (관리자 전용)</span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="라이트/다크 모드 전환">
                    🌗
                </button>
                <span id="session-timer-badge"></span>
                <span class="text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full border border-slate-200 dark:border-slate-600">
                    👤 {{ user.NickName }} (<strong class="text-blue-600 dark:text-blue-400">{{ user.Role }}</strong>)
                </span>
                <a href="/logout" class="text-sm font-semibold text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 transition">로그아웃</a>
            </div>
        </div>

        <main class="bg-white dark:bg-slate-800 rounded-xl shadow-md overflow-hidden border border-slate-200 dark:border-slate-700">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                    <thead class="bg-slate-50 dark:bg-slate-800">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">ID(고유)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">로그인 ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">이름 / 닉네임</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">현재 역할</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">가입일</th>
                            <th class="px-6 py-3 text-right text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">관리 액션</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody" class="bg-white dark:bg-slate-800 divide-y divide-slate-200 dark:divide-slate-700">
                        <!-- JS 렌더링 -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- 비밀번호 초기화 모달 -->
    <div id="resetModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-6 w-full max-w-sm m-4 border border-slate-200 dark:border-slate-700">
            <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100 mb-4">비밀번호 강제 초기화</h2>
            <p class="text-sm text-slate-600 dark:text-slate-400 mb-4">대상 유저의 비밀번호를 임시 발급합니다.</p>
            <input type="hidden" id="resetUserId">
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">임시 비밀번호</label>
                <input type="text" id="tempPassword" value="1234" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded focus:ring-2 focus:ring-blue-500 bg-white dark:bg-slate-700 text-slate-900 dark:text-white outline-none">
            </div>
            <div class="flex justify-end gap-2 mt-6">
                <button type="button" onclick="closeResetModal()" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded hover:bg-slate-200 dark:hover:bg-slate-600 font-semibold transition">취소</button>
                <button type="button" onclick="executeReset()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-bold shadow transition">초기화 실행</button>
            </div>
        </div>
    </div>

    <script src="/static/js/session_timer.js"></script>
    <script>
        async function fetchUsers() {
            try {
                const res = await fetch('/api/users');
                const json = await res.json();
                if (json.success) {
                    renderUsers(json.data);
                }
            } catch (err) {
                console.error(err);
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = '';
            
            const currentUserId = {{ user.UserId }};
            
            users.forEach(u => {
                const isMe = (u.UserId === currentUserId);
                
                tbody.innerHTML += `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-500 dark:text-slate-400">${u.UserId} ${isMe ? '<span class="text-xs bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded ml-1 font-bold">ME</span>' : ''}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-800 dark:text-slate-200">${u.LoginId}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-600 dark:text-slate-300">${u.Name} / ${u.NickName}</td>
                        <td class="px-6 py-4 whitespace-nowrap">
                            <select onchange="changeRole(${u.UserId}, this.value)" ${isMe ? 'disabled' : ''}
                                    class="text-sm rounded border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700 text-slate-800 dark:text-slate-200 focus:ring-blue-500 focus:border-blue-500 ${isMe ? 'opacity-50 cursor-not-allowed' : ''}">
                                <option value="user" ${u.Role === 'user' ? 'selected' : ''}>일반 사용자 (user)</option>
                                <option value="admin" ${u.Role === 'admin' ? 'selected' : ''}>최고 관리자 (admin)</option>
                            </select>
                        </td>
                        <td class="px-6 py-4 whitespace-nowrap text-xs text-slate-400 dark:text-slate-500">${u.CreatedAt}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                            <button onclick="openResetModal(${u.UserId}, '${u.LoginId}')" ${isMe ? 'disabled' : ''}
                                    class="text-red-600 hover:text-red-900 dark:text-red-400 dark:hover:text-red-300 transition ${isMe ? 'opacity-30 cursor-not-allowed' : ''}">
                                PW 초기화
                            </button>
                        </td>
                    </tr>
                `;
            });
        }

        async function changeRole(userId, newRole) {
            if (!confirm(`해당 사용자의 권한을 '${newRole}'(으)로 변경하시겠습니까?`)) {
                fetchUsers(); // revert select UI
                return;
            }
            try {
                const res = await fetch(`/api/users/${userId}/role`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ role: newRole })
                });
                const json = await res.json();
                if (json.success) {
                    alert('권한이 변경되었습니다.');
                    fetchUsers();
                } else {
                    alert(json.message);
                }
            } catch (err) {
                console.error(err);
                alert('요청 중 오류가 발생했습니다.');
            }
        }

        function openResetModal(userId, loginId) {
            document.getElementById('resetUserId').value = userId;
            document.getElementById('resetModal').classList.remove('hidden');
            document.getElementById('resetModal').classList.add('flex');
        }

        function closeResetModal() {
            document.getElementById('resetModal').classList.add('hidden');
            document.getElementById('resetModal').classList.remove('flex');
        }

        async function executeReset() {
            const userId = document.getElementById('resetUserId').value;
            const tempPw = document.getElementById('tempPassword').value;
            if(!tempPw) return alert('임시 비밀번호를 입력하세요.');
            
            try {
                const res = await fetch(`/api/users/${userId}/reset_password`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ temp_password: tempPw })
                });
                const json = await res.json();
                if (json.success) {
                    alert(json.message);
                    closeResetModal();
                } else {
                    alert(json.message);
                }
            } catch (err) {
                console.error(err);
                alert('요청 중 오류가 발생했습니다.');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchUsers);
    </script>
</body>
</html>

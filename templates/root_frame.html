<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="">
    <title>{% block title %}미니서버 통합 관리 시스템{% endblock %}</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0284c7',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
        // 로컬 스토리지 테마 캐시를 빠르게 초기화 (FOUC 전역 방지)
        if (localStorage.theme === 'dark' || ((!('theme' in localStorage) || localStorage.theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-full transition-colors duration-200">
    {% block body %}{% endblock %}
    <!-- 
      [역할]: 전역 로딩 오버레이 UI 
      [의존성 관계]: common.js 의 showGlobalLoading(), hideGlobalLoading() 함수에 의해 제어됨
      [변경 시 영향도]: 모든 페이지의 비동기 작업(fetch) 대기 상태 UI 형태가 변경됨
    -->
    <div id="global-loading-overlay" class="hidden fixed inset-0 z-[9999] bg-slate-900/60 backdrop-blur-sm flex-col justify-center items-center gap-3 transition-opacity duration-200" role="status" aria-live="polite">
        <div class="p-5 bg-white dark:bg-slate-800 rounded-2xl shadow-2xl flex flex-col items-center gap-3 min-w-[220px] border border-slate-100 dark:border-slate-700">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-brand-500"></i>
            <span id="global-loading-text" class="text-sm font-semibold text-slate-700 dark:text-slate-200">작업 처리 중입니다...</span>
        </div>
    </div>

    <!-- 공통 유틸리티 스크립트 선로드 -->
    <script src="/static/js/common.js"></script>
    {% block extra_scripts_base %}{% endblock %}
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 포털 - 미니서버 통합 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen dark:bg-slate-900 dark:text-slate-200 transition-colors duration-300">
    <div class="max-w-5xl mx-auto">
        <!-- 상단 내비게이션 바 -->
        <header class="bg-white dark:bg-slate-800 rounded-xl shadow-sm p-4 mb-8 flex justify-between items-center border border-slate-200 dark:border-slate-700 transition-colors">
            <div>
                <h1 class="text-xl font-bold text-slate-800 dark:text-slate-100">미니서버 통합 포털</h1>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">사용 가능한 시스템 메뉴를 선택하세요</p>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="라이트/다크 모드 전환">
                    🌗
                </button>
                <span id="session-timer-badge"></span>
                <a href="/mypage" class="text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1.5 rounded-full border border-slate-200 dark:border-slate-600 hover:bg-slate-200 dark:hover:bg-slate-600 transition">
                    👤 {{ user.NickName }} (<strong class="text-blue-600 dark:text-blue-400">{{ user.Role }}</strong>)
                </a>
                <a href="/logout" class="text-sm font-semibold text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 transition">
                    로그아웃
                </a>
            </div>
        </header>
        <!-- 대시보드 위젯 영역 -->
        <div id="dashboardWidget" class="mb-8 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 hidden">
            <!-- JS 동적 렌더링 -->
        </div>

        <!-- 메뉴 카드 레이아웃 -->
        <main id="menuContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JS에 의해 접속 허용된 메뉴 동적 렌더링 -->
        </main>
    </div>

    <script>
        async function loadPortalMenus() {
            try {
                const res = await fetch('/api/portal/menus');
                const menus = await res.json();
                const container = document.getElementById('menuContainer');
                container.innerHTML = '';
                
                menus.forEach(menu => {
                    container.innerHTML += `
                        <a href="${menu.Url}" class="group block bg-white dark:bg-slate-800 rounded-xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 hover:shadow-md hover:border-blue-400 dark:hover:border-blue-500 transition-all duration-200 transform hover:-translate-y-1">
                            <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100 group-hover:text-blue-600 dark:group-hover:text-blue-400 transition-colors">${menu.MenuName}</h2>
                            <p class="text-sm text-slate-500 dark:text-slate-400 mt-2 line-clamp-2">${menu.Description}</p>
                            <div class="mt-4 flex justify-end">
                                <span class="text-blue-600 dark:text-blue-400 font-medium text-sm group-hover:underline">입장하기 &rarr;</span>
                            </div>
                        </a>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        async function loadDashboardWidget() {
            try {
                const res = await fetch('/api/dashboard/stats');
                if (!res.ok) return;
                const json = await res.json();
                if (json.success) {
                    const data = json.data;
                    const widget = document.getElementById('dashboardWidget');
                    widget.classList.remove('hidden');
                    widget.innerHTML = `
                        <div class="bg-blue-50 dark:bg-slate-800 rounded-xl p-4 border border-blue-100 dark:border-slate-700 shadow-sm flex flex-col items-center justify-center">
                            <span class="text-xs font-semibold text-blue-600 dark:text-blue-400 uppercase tracking-wider mb-1">나의 장비</span>
                            <span class="text-3xl font-black text-slate-800 dark:text-slate-100">${data.my_equipments}대</span>
                        </div>
                        <div class="bg-indigo-50 dark:bg-slate-800 rounded-xl p-4 border border-indigo-100 dark:border-slate-700 shadow-sm flex flex-col items-center justify-center">
                            <span class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 uppercase tracking-wider mb-1">총 관리 장비</span>
                            <span class="text-3xl font-black text-slate-800 dark:text-slate-100">${data.total_equipments}대</span>
                        </div>
                    `;
                }
            } catch (e) {
                console.error("위젯 데이터 로드 실패", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadPortalMenus();
            loadDashboardWidget();
        });
    </script>
    <script src="/static/js/session_timer.js"></script>
</body>
</html>

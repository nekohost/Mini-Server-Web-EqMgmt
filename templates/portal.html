<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메인 포털 - 미니서버 통합 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen">
    <div class="max-w-5xl mx-auto">
        <!-- 상단 내비게이션 바 -->
        <header class="bg-white rounded-xl shadow-sm p-4 mb-8 flex justify-between items-center border border-slate-200">
            <div>
                <h1 class="text-xl font-bold text-slate-800">미니서버 통합 포털</h1>
                <p class="text-xs text-slate-500 mt-0.5">사용 가능한 시스템 메뉴를 선택하세요</p>
            </div>
            <div class="flex items-center gap-4">
                <span id="session-timer-badge"></span>
                <span class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                    👤 {{ user.NickName }} (<strong class="text-blue-600">{{ user.Role }}</strong>)
                </span>
                <a href="/logout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition">
                    로그아웃
                </a>
            </div>
        </header>

        <!-- 메뉴 카드 레이아웃 -->
        <main id="menuContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- JS에 의해 접속 허용된 메뉴 동적 렌더링 -->
        </main>
    </div>

    <script>
        async function loadPortalMenus() {
            try {
                const res = await fetch('/api/portal/menus');
                const menus = await res.json();
                const container = document.getElementById('menuContainer');
                container.innerHTML = '';

                if (menus.length === 0) {
                    container.innerHTML = `
                        <div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-500 shadow-sm">
                            접근 가능한 메뉴가 없습니다. 관리자에게 문의하세요.
                        </div>
                    `;
                    return;
                }

                menus.forEach(menu => {
                    container.innerHTML += `
                        <a href="${menu.Url}" class="group bg-white p-6 rounded-2xl shadow-sm hover:shadow-md border border-slate-200 transition duration-200 flex flex-col justify-between">
                            <div>
                                <div class="w-12 h-12 rounded-xl bg-blue-50 text-blue-600 flex items-center justify-center font-bold text-xl mb-4 group-hover:bg-blue-600 group-hover:text-white transition">
                                    📁
                                </div>
                                <h2 class="text-lg font-bold text-slate-800 group-hover:text-blue-600 transition mb-2">
                                    ${menu.MenuName}
                                </h2>
                                <p class="text-sm text-slate-500 line-clamp-2">
                                    ${menu.Description || '시스템 기능으로 이동합니다.'}
                                </p>
                            </div>
                            <div class="mt-6 flex items-center text-xs font-semibold text-blue-600 group-hover:translate-x-1 transition">
                                바로가기 &rarr;
                            </div>
                        </a>
                    `;
                });
            } catch (err) {
                console.error(err);
            }
        }

        loadPortalMenus();
    </script>
    <script src="/static/js/session_timer.js"></script>
</body>
</html>

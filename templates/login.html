{% extends 'root_frame.html' %}

{% block title %}로그인 - 미니서버 통합 관리 시스템{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white dark:bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200 dark:border-slate-700">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800 dark:text-slate-100">미니서버 통합 관리</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">계정 정보를 입력하여 로그인하세요</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">아이디</label>
                <input type="text" id="LoginId" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="아이디를 입력하세요">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">비밀번호</label>
                <input type="password" id="Password" required 
                       class="w-full px-4 py-2.5 bg-white dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition"
                       placeholder="비밀번호를 입력하세요">
                <div class="text-right mt-2">
                    <button type="button" onclick="document.getElementById('resetModal').classList.remove('hidden')" class="text-xs text-slate-500 dark:text-slate-400 hover:text-blue-600 hover:underline">
                        비밀번호를 잊으셨나요?
                    </button>
                </div>
            </div>

            <div id="errorMessage" class="hidden p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-200 text-center"></div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200">
                로그인
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-700 text-center">
            <p class="text-sm text-slate-500 dark:text-slate-400">계정이 없으신가요? <a href="/register" class="text-blue-600 dark:text-blue-400 font-semibold hover:underline">회원가입하기</a></p>
        </div>
    </div>
</div>

<!-- 비밀번호 재설정 모달 -->
<div id="resetModal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 transition-opacity">
    <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-xl shadow-2xl p-6 relative">
        <button type="button" onclick="document.getElementById('resetModal').classList.add('hidden')" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i class="fas fa-times text-xl"></i>
        </button>
        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-4">비밀번호 재설정</h3>
        <p class="text-sm text-slate-500 dark:text-slate-400 mb-4">가입 시 등록하신 이메일 주소를 입력하시면 비밀번호 재설정 링크를 보내드립니다.</p>
        
        <form id="resetRequestForm" class="space-y-4">
            <input type="email" id="resetEmail" required
                   class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-700 text-slate-900 dark:text-white border border-slate-300 dark:border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                   placeholder="이메일 주소">
            <div id="resetMessage" class="hidden text-sm p-3 rounded-lg text-center"></div>
            <button type="submit" id="btnReset"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-lg shadow transition duration-200">
                재설정 링크 받기
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_scripts_base %}
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const LoginId = document.getElementById('LoginId').value;
        const Password = document.getElementById('Password').value;
        const errorDiv = document.getElementById('errorMessage');

        errorDiv.classList.add('hidden');

        try {
            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ LoginId, Password })
            });

            const data = await res.json();

            if (res.ok && data.success) {
                location.href = '/portal';
            } else {
                errorDiv.innerText = data.message || '로그인에 실패했습니다.';
                errorDiv.classList.remove('hidden');
            }
        } catch (err) {
            errorDiv.innerText = '서버 통신 오류가 발생했습니다.';
            errorDiv.classList.remove('hidden');
        }
    });

    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const errorDiv = document.getElementById('errorMessage');
        if (params.get('error') === 'concurrent_login') {
            errorDiv.innerText = '다른 기기(브라우저)에서 로그인하여 현재 세션이 만료되었습니다.';
            errorDiv.classList.remove('hidden');
        } else if (params.get('error') === 'session_expired') {
            errorDiv.innerText = '세션이 만료되었습니다. 다시 로그인해주세요.';
            errorDiv.classList.remove('hidden');
        }
    });

    document.getElementById('resetRequestForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('resetEmail').value;
        const msgDiv = document.getElementById('resetMessage');
        const btn = document.getElementById('btnReset');
        
        msgDiv.classList.add('hidden');
        btn.disabled = true;
        btn.innerText = '요청 중...';

        try {
            const res = await fetch('/api/auth/request_password_reset', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            
            msgDiv.classList.remove('hidden');
            if (data.success) {
                msgDiv.className = 'text-sm p-3 rounded-lg text-center bg-green-50 text-green-600 border border-green-200';
                msgDiv.innerText = data.message;
            } else {
                msgDiv.className = 'text-sm p-3 rounded-lg text-center bg-red-50 text-red-600 border border-red-200';
                msgDiv.innerText = data.message;
            }
        } catch(err) {
            msgDiv.classList.remove('hidden');
            msgDiv.className = 'text-sm p-3 rounded-lg text-center bg-red-50 text-red-600 border border-red-200';
            msgDiv.innerText = '서버 통신 오류가 발생했습니다.';
        } finally {
            btn.disabled = false;
            btn.innerText = '재설정 링크 받기';
        }
    });
</script>
{% endblock %}

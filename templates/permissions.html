<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 권한 관리 - 미니서버 통합 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 dark:bg-slate-900 dark:text-slate-200 transition-colors duration-300 min-h-screen">
    <div class="max-w-4xl mx-auto">
        <!-- 상단 헤더 -->
        <div class="bg-white dark:bg-slate-800 rounded-xl p-4 shadow-sm mb-6 flex justify-between items-center border border-slate-200 dark:border-slate-700 transition-colors">
            <div class="flex items-center gap-3">
                <a href="/portal" class="text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 text-sm font-semibold transition">&larr; 포털로</a>
                <span class="text-slate-300 dark:text-slate-600">|</span>
                <span class="text-sm font-bold text-slate-800 dark:text-slate-100">메뉴 접근 권한 관리</span>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="window.toggleTheme()" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition" title="라이트/다크 모드 전환">
                    🌗
                </button>
                <span id="session-timer-badge"></span>
                <span class="text-sm font-medium text-slate-600 dark:text-slate-300 bg-slate-100 dark:bg-slate-700 px-3 py-1 rounded-full border border-slate-200 dark:border-slate-600">
                    👤 {{ user.NickName }} (<strong class="text-blue-600 dark:text-blue-400">{{ user.Role }}</strong>)
                </span>
                <a href="/logout" class="text-sm font-semibold text-red-600 dark:text-red-400 hover:text-red-800 dark:hover:text-red-300 transition">로그아웃</a>
            </div>
        </div>

        <!-- 권한 관리 테이블 카드 -->
        <main class="bg-white dark:bg-slate-800 rounded-xl shadow-md border border-slate-200 dark:border-slate-700 overflow-hidden">
            <div class="p-6 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-slate-800 dark:text-slate-100">역할(Role)별 메뉴 권한</h2>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">체크박스를 토글하여 각 사용자 역할이 접근 가능한 메뉴를 설정하세요.</p>
                </div>
                <button onclick="savePermissions()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg shadow transition">
                    설정 저장하기
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200 dark:divide-slate-700">
                    <thead class="bg-slate-50 dark:bg-slate-800">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase">역할 (Role)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase">메뉴 명</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 dark:text-slate-400 uppercase">메뉴 코드</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-slate-500 dark:text-slate-400 uppercase">접근 허용</th>
                        </tr>
                    </thead>
                    <tbody id="permTableBody" class="divide-y divide-slate-200 dark:divide-slate-700 bg-white dark:bg-slate-800">
                        <!-- JS 렌더링 -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script src="/static/js/session_timer.js"></script>
    <script>
        let currentPermissions = [];

        async function fetchPermissions() {
            try {
                const res = await fetch('/api/permissions');
                currentPermissions = await res.json();
                
                const tbody = document.getElementById('permTableBody');
                tbody.innerHTML = '';

                currentPermissions.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50 transition">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-bold text-slate-800 dark:text-slate-200">
                                ${item.Role}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-slate-700 dark:text-slate-300">
                                ${item.MenuName}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-slate-500 dark:text-slate-400">
                                ${item.MenuCode}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <input type="checkbox" ${item.IsAllowed ? 'checked' : ''} 
                                       onchange="togglePerm(${index}, this.checked)"
                                       class="w-5 h-5 text-blue-600 bg-slate-100 dark:bg-slate-700 border-slate-300 dark:border-slate-600 rounded focus:ring-blue-500 dark:focus:ring-blue-600 cursor-pointer">
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
                alert('권한 정보를 불러오지 못했습니다.');
            }
        }

        function togglePerm(index, isChecked) {
            currentPermissions[index].IsAllowed = isChecked ? 1 : 0;
        }

        async function savePermissions() {
            try {
                const res = await fetch('/api/permissions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentPermissions)
                });
                
                if (res.ok) {
                    alert('권한 설정이 변경되었습니다.');
                    fetchPermissions();
                } else {
                    alert('권한 변경에 실패했습니다.');
                }
            } catch (err) {
                console.error(err);
                alert('오류가 발생했습니다.');
            }
        }

        document.addEventListener('DOMContentLoaded', fetchPermissions);
    </script>
</body>
</html>

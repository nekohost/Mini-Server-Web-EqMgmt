<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 권한 관리 - 미니서버 통합 관리 시스템</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8 min-h-screen">
    <div class="max-w-4xl mx-auto">
        <!-- 상단 헤더 -->
        <header class="bg-white rounded-xl shadow-sm p-4 mb-6 flex justify-between items-center border border-slate-200">
            <div class="flex items-center gap-3">
                <a href="/portal" class="text-slate-500 hover:text-slate-800 text-sm font-semibold transition">&larr; 포털로</a>
                <h1 class="text-xl font-bold text-slate-800">메뉴 접근 권한 관리</h1>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
                    👤 {{ user.NickName }} ({{ user.Role }})
                </span>
                <a href="/logout" class="text-sm font-semibold text-red-600 hover:text-red-800 transition">로그아웃</a>
            </div>
        </header>

        <!-- 권한 관리 테이블 카드 -->
        <main class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 border-b border-slate-100 flex justify-between items-center">
                <div>
                    <h2 class="text-lg font-bold text-slate-800">역할(Role)별 메뉴 권한</h2>
                    <p class="text-xs text-slate-500 mt-1">체크박스를 토글하여 각 사용자 역할이 접근 가능한 메뉴를 설정하세요.</p>
                </div>
                <button onclick="savePermissions()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-lg shadow transition">
                    설정 저장하기
                </button>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">역할 (Role)</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">메뉴 명</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase">메뉴 코드</th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-slate-500 uppercase">접근 허용</th>
                        </tr>
                    </thead>
                    <tbody id="permTableBody" class="divide-y divide-slate-100 bg-white">
                        <!-- JS 렌더링 -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <script>
        let currentPermissions = [];

        async function fetchPermissions() {
            try {
                const res = await fetch('/api/permissions');
                currentPermissions = await res.json();
                
                const tbody = document.getElementById('permTableBody');
                tbody.innerHTML = '';

                currentPermissions.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr class="hover:bg-slate-50 transition">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold text-slate-800">
                                ${item.Role}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-slate-700">
                                ${item.MenuName}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-mono text-slate-500">
                                ${item.MenuCode}
                            </td>
                            <td class="px-6 py-4 whitespace-nowrap text-center">
                                <input type="checkbox" ${item.IsAllowed ? 'checked' : ''} 
                                       onchange="togglePerm(${index}, this.checked)"
                                       class="w-5 h-5 text-blue-600 border-slate-300 rounded focus:ring-blue-500 cursor-pointer">
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error(err);
                alert('권한 정보를 불러오지 못했습니다.');
            }
        }

        function togglePerm(index, isChecked) {
            currentPermissions[index].IsAllowed = isChecked ? 1 : 0;
        }

        async function savePermissions() {
            try {
                const res = await fetch('/api/permissions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(currentPermissions)
                });
                
                if (res.ok) {
                    alert('권한 설정이 변경되었습니다.');
                    fetchPermissions();
                } else {
                    alert('권한 변경에 실패했습니다.');
                }
            } catch (err) {
                console.error(err);
                alert('오류가 발생했습니다.');
            }
        }

        fetchPermissions();
    </script>
</body>
</html>
